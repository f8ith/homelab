networks:
  web:
    external: true
  internal:
    external: true
  immich_net:
    name: immich_net
    driver: bridge

services:
  immich-server:
    extends:
      file: ../common.yml
      service: app
    container_name: immich-server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    networks:
      - web
      - internal
      - immich_net
    # extends:
    #   file: hwaccel.transcoding.yml
    #   service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    volumes:
      - $MEDIADIR/immich:/usr/src/app/upload
      - $MEDIADIR/photo-library:/usr/src/app/photo-library
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - redis
      - immich-postgres
    restart: always
    environment:
      DB_HOSTNAME: "${DB_HOSTNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_USERNAME: "${DB_USERNAME}"
    labels:
      - "traefik.enable=true"
      # HTTP Routers
      - "traefik.http.routers.immich-rtr.entrypoints=websecure"
      - "traefik.http.routers.immich-rtr.rule=Host(`immich.$DOMAINNAME_1`)"
      - "traefik.http.routers.immich-i-rtr.entrypoints=internalsecure"
      - "traefik.http.routers.immich-i-rtr.rule=Host(`immich.${DOCKER_HOST_NAME}.i.$DOMAINNAME_1`)"
      # HTTP Services
      - "traefik.http.routers.immich-rtr.service=immich-svc"
      - "traefik.http.routers.immich-i-rtr.service=immich-svc"
      - "traefik.http.services.immich-svc.loadbalancer.server.port=2283"

  immich-machine-learning:
    extends:
      file: ../common.yml
      service: app
    container_name: immich-machine-learning
    networks:
      - immich_net
    # For hardware acceleration, add one of -[armnn, cuda, openvino] to the image tag.
    # Example tag: ${IMMICH_VERSION:-release}-cuda
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    # extends: # uncomment this section for hardware acceleration - see https://immich.app/docs/features/ml-hardware-acceleration
    #   file: hwaccel.ml.yml
    #   service: cpu # set to one of [armnn, cuda, openvino, openvino-wsl] for accelerated inference - use the `-wsl` version for WSL2 where applicable
    volumes:
      - model-cache:/cache
    restart: always

  redis:
    extends:
      file: ../common.yml
      service: app
    container_name: immich-redis
    image: docker.io/redis:6.2-alpine@sha256:328fe6a5822256d065debb36617a8169dbfbd77b797c525288e465f56c1d392b
    networks:
      - immich_net
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  immich-postgres:
    extends:
      file: ../common.yml
      service: app
    container_name: immich-postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    networks:
      - immich_net
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      DB_STORAGE_TYPE: ${DB_STORAGE_TYPE}
    volumes:
      - ${DATADIR}/appdata/immich_postgres/data:/var/lib/postgresql/data
    restart: always

volumes:
  model-cache:
