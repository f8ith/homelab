http:
  middlewares:
    authelia:
      forwardAuth:
        address: 'https://auth.jamietong.com/api/authz/forward-auth'
        ## The following commented line is for configuring the Authelia URL in the proxy. We strongly suggest this is
        ## configured in the Session Cookies section of the Authelia configuration.
        # address: 'http://authelia:9091/api/authz/forward-auth?authelia_url=https%3A%2F%2Fauth.example.com%2F'
        trustForwardHeader: true
        maxResponseBodySize: 8192
        authResponseHeaders:
          - 'Remote-User'
          - 'Remote-Groups'
          - 'Remote-Email'
          - 'Remote-Name'
        tls:
          ca: '/certificates/ca.public.crt'
          cert: '/certificates/traefik.public.crt'
          key: '/certificates/traefik.private.pem'
    authelia-basic:
      forwardAuth:
        address: 'http://auth.jamietong.com/api/verify?auth=basic'
        trustForwardHeader: true
        maxResponseBodySize: 8192
        authResponseHeaders:
          - 'Remote-User'
          - 'Remote-Groups'
          - 'Remote-Email'
          - 'Remote-Name'
        tls:
          ca: '/certificates/ca.public.crt'
          cert: '/certificates/traefik.public.crt'
          key: '/certificates/traefik.private.pem'
