networks:
  web:
    external: true
  internal:
    external: true
  qbittorrent:
    external: true
  arr:
    name: arr
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.92.0/24

services:
  # Sonarr - TV Shows management
  sonarr:
    extends:
      file: ../common.yml
      service: app
    image: lscr.io/linuxserver/sonarr:develop
    container_name: sonarr
    networks:
      - arr
      - internal
      - qbittorrent
    volumes:
      - $DATADIR/appdata/sonarr:/config
      - $MEDIADIR:/data
      - $MEDIADIR/@media:/data/media
      - "/etc/localtime:/etc/localtime:ro"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr-rtr.entrypoints=internalsecure"
      - "traefik.http.routers.sonarr-rtr.rule=Host(`sonarr.${DOCKER_HOST_NAME}.i.$DOMAINNAME_1`) || Host(`sonarr.$DOMAINNAME_1`)"
      - "traefik.http.routers.sonarr-rtr.service=sonarr-svc"
      - "traefik.http.services.sonarr-svc.loadbalancer.server.port=8989"
      - "traefik.docker.network=internal"

  prowlarr: #indexer manager for Sonarr & Radarr
    extends:
      file: ../common.yml
      service: app
    image: ghcr.io/linuxserver/prowlarr:develop
    container_name: prowlarr
    networks:
      - arr
      - internal
    volumes:
      - $DATADIR/appdata/prowlarr:/config
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr-rtr.entrypoints=internalsecure"
      - "traefik.http.routers.prowlarr-rtr.rule=Host(`prowlarr.${DOCKER_HOST_NAME}.i.$DOMAINNAME_1`) || Host(`prowlarr.$DOMAINNAME_1`)"
      - "traefik.http.routers.prowlarr-rtr.service=prowlarr-svc"
      - "traefik.http.services.prowlarr-svc.loadbalancer.server.port=9696"
      - "traefik.docker.network=internal"

  radarr: #movie search agent
    extends:
      file: ../common.yml
      service: app
    image: ghcr.io/linuxserver/radarr
    container_name: radarr
    networks:
      - arr
      - internal
      - qbittorrent
    volumes:
      - $DATADIR/appdata/radarr:/config
      - $MEDIADIR:/data
      - $MEDIADIR/@media:/data/media
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr-rtr.entrypoints=internalsecure"
      - "traefik.http.routers.radarr-rtr.rule=Host(`radarr.${DOCKER_HOST_NAME}.i.$DOMAINNAME_1`) || Host(`radarr.$DOMAINNAME_1`)"
      - "traefik.http.routers.radarr-rtr.service=radarr-svc"
      - "traefik.http.services.radarr-svc.loadbalancer.server.port=7878"
      - "traefik.docker.network=internal"

  seerr:
    extends:
      file: ../common.yml
      service: app
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    networks:
      - arr
      - web
      - qbittorrent
    environment:
      LOG_LEVEL: debug
    volumes:
      - $DATADIR/appdata/jellyseerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.seerr-rtr.entrypoints=websecure,internalsecure"
      - "traefik.http.routers.seerr-rtr.rule=Host(`seerr.$DOMAINNAME_1`)"
      - "traefik.http.routers.seerr-rtr.service=seerr-svc"
      - "traefik.http.services.seerr-svc.loadbalancer.server.port=5055"

  # subtitles
  bazarr:
    extends:
      file: ../common.yml
      service: app
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    networks:
      - arr
      - internal
    volumes:
      - $DATADIR/appdata/bazarr:/config
      - $MEDIADIR/@media:/data/media
      - $MEDIADIR/subtitles:/data/subtitles
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bazarr-rtr.entrypoints=internalsecure"
      - "traefik.http.routers.bazarr-rtr.rule=Host(`bazarr.${DOCKER_HOST_NAME}.i.$DOMAINNAME_1`) || Host(`bazarr.$DOMAINNAME_1`)"
      - "traefik.http.routers.bazarr-rtr.service=bazarr-svc"
      - "traefik.http.services.bazarr-svc.loadbalancer.server.port=6767"
      - "traefik.docker.network=internal"
