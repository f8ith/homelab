volumes:
  bao_shared:

services:
  openbao-agent:
    image: ghcr.io/openbao/openbao:latest
    entrypoint: ["bao", "agent", "-config=/bao/bao-agent.hcl"]
    volumes:
      - ./bao-agent.hcl:/bao/bao-agent.hcl:ro
      - $DATADIR/secrets/bao/role_id:/bao/role_id:ro
      - $DATADIR/secrets/bao/secret_id:/bao/secret_id:ro
      - bao_shared:/bao-shared
  doco-cd:
    image: ghcr.io/kimdre/doco-cd:0.125.1@sha256:38198abbda1b55da7a7f37a7924b2ccdcc0583bd24466b7c2103ef6cd2ffc828
    restart: unless-stopped
    environment:
      TZ: Asia/Hong_Kong
      SELF_UPDATE_ENABLED: "true"
      SELF_UPDATE_STRATEGY: auto
      SECRET_PROVIDER: openbao
      SECRET_PROVIDER_ACCESS_TOKEN_FILE: /bao-shared/.openbao-token
      POLL_CONFIG: |
        - url: https://github.com/f8ith/homelab.git
          reference: doco
          interval: 30
          target: ${DOCKER_HOST_NAME}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - $DATADIR/doco-cd:/data
      - bao_shared:/bao-shared:ro
    healthcheck:
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3

